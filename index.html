<style>
:root {
  --paper: #EDF1E4;
  --surface: #E2E8D5;
  --ink: #1B2A1F;
  --muted: #4E5E4F;
  --moss: #2F5233;
  --bamboo: #6E9A3C;
  --shoot: #B8CC5E;
  --soil: #6B4F36;
  --line: #C6D1B4;
  --flow: #6E9A3C;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111A13;
    --surface: #18241B;
    --ink: #E4ECD8;
    --muted: #A3B29A;
    --moss: #A9C98A;
    --bamboo: #8DBB55;
    --shoot: #C9DB72;
    --soil: #B08A62;
    --line: #2B3B2E;
    --flow: #C9DB72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111A13; --surface: #18241B; --ink: #E4ECD8; --muted: #A3B29A;
  --moss: #A9C98A; --bamboo: #8DBB55; --shoot: #C9DB72; --soil: #B08A62;
  --line: #2B3B2E; --flow: #C9DB72; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Literata", Georgia, "Times New Roman", serif;
  font-size: 1.0625rem;
  line-height: 1.68;
  -webkit-font-smoothing: antialiased;
}
img, svg { max-width: 100%; }
a { color: var(--moss); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--bamboo); }
:focus-visible { outline: 3px solid var(--bamboo); outline-offset: 3px; border-radius: 4px; }

h1, h2, h3, .display {
  font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin: 0;
}
h2 { font-size: clamp(2rem, 4.2vw, 3rem); font-weight: 800; margin-bottom: 1.25rem; }
h3 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: .4rem; }
p { margin: 0 0 1rem; max-width: 64ch; }

/* ---------- Header ---------- */
.top {
  display: flex; align-items: center; justify-content: space-between;
  max-width: 1120px; margin: 0 auto; padding: 1.25rem 1.5rem;
}
.brand { display: flex; align-items: center; gap: .6rem; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: 1.4rem; color: var(--ink); text-decoration: none; }
.brand svg { width: 34px; height: 34px; }
.top nav { display: flex; align-items: center; gap: 1.25rem; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 500; }
.top nav a { color: var(--muted); text-decoration: none; }
.top nav a:hover { color: var(--ink); }
@media (max-width: 720px) { .top nav a:not(.btn) { display: none; } }

.btn {
  display: inline-block; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700;
  font-size: 1rem; padding: .8rem 1.4rem; border-radius: 999px; text-decoration: none;
  background: var(--moss); color: var(--paper); border: 2px solid var(--moss);
}
.btn:hover { background: var(--bamboo); border-color: var(--bamboo); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--moss); }
.btn.ghost:hover { background: var(--moss); color: var(--paper); }
.top nav .btn { padding: .5rem 1rem; color: var(--paper); }

/* ---------- Hero ---------- */
.hero {
  max-width: 1120px; margin: 0 auto; padding: 2rem 1.5rem 3rem;
  display: grid; grid-template-columns: 1.15fr 1fr; gap: 2rem; align-items: center;
}
.hero h1 { font-size: clamp(3rem, 7.6vw, 5.6rem); font-weight: 800; letter-spacing: -0.045em; line-height: .92; margin-bottom: 1.5rem; }
.hero h1 span { display: block; }
.hero h1 span + span { color: var(--bamboo); }
.hero .lede { font-size: 1.25rem; line-height: 1.55; color: var(--muted); max-width: 34ch; }
.hero .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.75rem; }
.hero-art { width: 100%; height: auto; }
@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; }
  .hero-art { max-width: 360px; margin: 0 auto; order: -1; }
}

/* hero growth animation (one orchestrated moment) */
.grow .stalk { transform-origin: 50% 100%; transform-box: fill-box; animation: rise 1.6s cubic-bezier(.2,.8,.2,1) both; }
.grow .stalk.s2 { animation-delay: .25s; }
.grow .stalk.s3 { animation-delay: .5s; }
.grow .leaf { transform-box: fill-box; transform-origin: 0% 100%; animation: unfurl .7s ease-out both; }
.grow .root { stroke-dasharray: 400; stroke-dashoffset: 400; animation: dig 2.2s ease-out .1s forwards; }
@keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes unfurl { from { transform: scale(0) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes dig { to { stroke-dashoffset: 0; } }
